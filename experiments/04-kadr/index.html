<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>КРОВОСТОК — КАДР</title><meta name="theme-color" content="#10100e"><link rel="stylesheet" href="stage.css"><script defer src="../../story.js"></script><script defer src="../../second_thursday.js"></script><script defer src="../../next_friday.js"></script><script defer src="../../third_saturday.js"></script><script defer src="../../fourth_sunday.js"></script><script defer src="engine.js"></script><script defer src="stage.js"></script></head><body>
<div id="legacy" aria-hidden="true">
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Список переписок">
    <header class="sidebar-head">
      <div class="brand"><span class="brand-glyph">К</span><div><b>КРОВОСТОК</b><small>Чужие переписки</small></div></div>
      <button class="icon-btn" id="settingsButton" title="Настройки" aria-label="Настройки">⚙</button>
    </header>
    <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Поиск по чатам" aria-label="Поиск по чатам" autocomplete="off"></div>
    <div class="chat-list" id="chatList" role="list"></div>
  </aside>
  <main class="conversation" id="conversation">
    <header class="conversation-head">
      <button class="icon-btn back-btn" id="backButton" aria-label="Назад к чатам"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span class="back-counter" id="totalUnread" hidden></span></button>
      <div class="avatar big" id="activeAvatar" aria-hidden="true">С</div>
      <div class="chat-identity"><b id="activeName">Серёга</b><small id="activeStatus">был недавно</small></div>
      <div class="head-actions"><button id="soundButton" class="icon-btn" title="Звук уведомлений" aria-label="Включить или выключить звук"><svg id="soundIcon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 9a5 5 0 0 1 0 6m2.5-9a9 9 0 0 1 0 12"/></svg></button><button id="speedButton" class="icon-btn speed-btn" title="Скорость переписки" aria-label="Сменить скорость">1×</button></div>
    </header>
    <div class="thread-scroll" id="threadScroll"><div id="thread" class="thread" aria-live="polite" aria-relevant="additions"></div></div>
    <div class="interaction" id="interaction">
      <div class="quick-title" id="quickTitle" hidden></div>
      <div class="quick-replies" id="quickReplies"></div>
      <div class="fake-input"><span class="clip-icon">＋</span><span id="fakeInputText">Сообщение</span><span class="mic-icon">◉</span></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="closeModal" class="modal-close" aria-label="Закрыть">×</button><h2 id="modalTitle">Настройки</h2><div id="modalContent"></div></div></div>
</div>
<div id="stage" class="stage" tabindex="-1">
 <canvas id="art" aria-hidden="true"></canvas><div class="grain" aria-hidden="true"></div>
 <header class="overhead"><div class="identity"><b>КРОВОСТОК</b><span>КАДР / АЛЬТЕРНАТИВНАЯ ПОСТАНОВКА</span></div><button type="button" id="archiveBtn" class="textcontrol">ВСЕ ГОЛОСА <span id="unreadCounter"></span></button></header>
 <div class="gigantic" id="backgroundWord" aria-hidden="true">СЕРЁГА</div>
 <section id="performance" class="performance" aria-live="polite"><div class="chapter" id="chapter">ЧЕТВЕРГ</div><div class="speaker"><i></i><span id="speaker">Серёга</span><small id="clock">09:04</small></div><div class="say" id="line">…</div><div class="previous" id="previous"></div><div class="typing" id="stageTyping">...</div><div class="choices" id="choices"></div></section>
 <div class="lower"><div id="count">01 / 144</div><div id="prompt">ОЖИДАНИЕ СООБЩЕНИЯ</div><div class="loweractions"><button id="fastBtn" class="textcontrol" type="button">ПРОПУСТИТЬ ОЖИДАНИЕ</button><button id="soundBtn" class="textcontrol" type="button">ЗВУК</button></div></div>
 <div id="archive" class="archive" hidden><div class="archiveheading"><span>ЧУЖИЕ ГОЛОСА</span><button id="closeArchive" type="button" class="textcontrol">ЗАКРЫТЬ ×</button></div><div id="names" class="names"></div><p>НЕ ВСЕ ИСТОРИИ СВЯЗАНЫ. НЕ ВСЕ ЛЮДИ ЗНАЮТ ДРУГ ДРУГА.</p></div>
 <div id="photoCover" class="photoCover" hidden><button id="closePhoto" type="button">× ЗАКРЫТЬ</button><img src="../../assets/head-kitchen.jpg" alt="Фотография из переписки"></div>
</div></body></html>
